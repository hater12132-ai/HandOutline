name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Build and package
        run: |
          xmake f -y -p android -a arm64-v8a -m release --ndk=${{ steps.ndk.outputs.ndk-path }}
          xmake -y
          echo "=== locate levipack ==="
          find build -name 'BactroNative.levipack' -o -name '*.levipack' 2>/dev/null || true
          find build -name 'libBactroNative.so' 2>/dev/null || true

      - name: Upload levipack
        uses: actions/upload-artifact@v4
        with:
          name: BactroNative-levipack
          path: |
            build/**/BactroNative.levipack
            build/**/*.levipack
          if-no-files-found: error
          compression-level: 0
